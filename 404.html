    <style>
        :root {
            --luxury-gold: #D4AF37;
            --luxury-softgold: #E8D49E;
            --luxury-cream: #FAF9F6;
            --luxury-charcoal: #121212;
            --luxury-slate: #F1F1EF;
            --luxury-border: #EBE7E0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--luxury-cream);
            color: var(--luxury-charcoal);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Subtle background background patterns */
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: radial-gradient(var(--luxury-gold) 1px, transparent 1px);
            background-size: 24px 24px;
            opacity: 0.08;
            pointer-events: none;
        }

        .error-card {
            background-color: #ffffff;
            border: 1px solid var(--luxury-border);
            border-radius: 4px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.04);
            padding: 50px 40px;
            text-align: center;
            max-width: 520px;
            width: 100%;
            position: relative;
            z-index: 10;
        }

        .logo-container {
            margin-bottom: 25px;
            display: inline-block;
            padding: 8px;
            background: #ffffff;
            border-radius: 50%;
            border: 1px solid var(--luxury-border);
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }

        .error-logo {
            width: 70px;
            height: 70px;
            object-fit: contain;
            display: block;
        }

        .error-title-decorative {
            font-family: 'Playfair Display', serif;
            font-size: 80px;
            font-weight: 700;
            color: var(--luxury-charcoal);
            line-height: 1;
            margin-bottom: 10px;
            letter-spacing: -0.02em;
        }

        .error-subtitle {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            font-style: italic;
            font-weight: 500;
            color: var(--luxury-gold);
            margin-bottom: 20px;
        }

        .error-message {
            font-size: 14px;
            color: #666666;
            margin-bottom: 35px;
            line-height: 1.6;
            font-weight: 300;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .back-home-btn {
            background-color: var(--luxury-charcoal);
            color: #ffffff;
            padding: 14px 28px;
            border-radius: 2px;
            text-decoration: none;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            display: block;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(18, 18, 18, 0.15);
            border: 1px solid var(--luxury-charcoal);
        }
        
        .back-home-btn:hover {
            background-color: var(--luxury-gold);
            border-color: var(--luxury-gold);
            color: var(--luxury-charcoal);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.25);
        }
        
        .whatsapp-btn {
            background-color: transparent;
            color: var(--luxury-charcoal);
            border: 2px solid var(--luxury-charcoal);
            padding: 13px 28px;
            border-radius: 2px;
            text-decoration: none;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s ease;
        }
        
        .whatsapp-btn:hover {
            background-color: var(--luxury-charcoal);
            color: #ffffff;
            transform: translateY(-2px);
        }

        .whatsapp-icon {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }
        
        @media (max-width: 576px) {
            .error-card {
                padding: 40px 24px;
            }
            
            .error-title-decorative {
                font-size: 64px;
            }
            
            .error-subtitle {
                font-size: 20px;
            }
        }
    </style>
</head>
